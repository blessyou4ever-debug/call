name: Build CallScheduler Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare Android Project & Build Debug APK
        run: |
          set -e
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          mkdir -p /tmp/callscheduler_build
          cd /tmp/callscheduler_build
          echo "" | base64 -d > project.zip
          unzip -o -q project.zip
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallScheduler-debug-apk
          path: /tmp/callscheduler_build/app/build/outputs/apk/debug/app-debug.apk
